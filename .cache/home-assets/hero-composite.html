<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box} body{margin:0;width:2400px;height:1400px;overflow:hidden;background:#fff200;font-family:Arial,Helvetica,sans-serif;color:#000}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.09) 1px,transparent 1px);background-size:64px 64px}
  .label{position:absolute;left:90px;top:80px;border:8px solid #000;background:#fff;padding:22px 30px;font-weight:900;font-size:42px;text-transform:uppercase;box-shadow:14px 14px 0 #000;letter-spacing:-1px}
  .builder{position:absolute;right:118px;top:122px;width:1580px;height:920px;border:9px solid #000;box-shadow:24px 24px 0 #000;background:#fff;overflow:hidden;transform:rotate(1deg)}
  .builder img{width:100%;height:100%;object-fit:cover;object-position:left top}
  .phone{position:absolute;width:420px;height:680px;border:8px solid #000;background:#fff;box-shadow:18px 18px 0 #000;overflow:hidden;border-radius:28px}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .phone.link{left:130px;bottom:84px;transform:rotate(-4deg)} .phone.menu{right:114px;bottom:70px;transform:rotate(4deg)}
  .portfolio{position:absolute;left:520px;bottom:48px;width:760px;height:420px;border:8px solid #000;background:#fff;box-shadow:18px 18px 0 #000;overflow:hidden;transform:rotate(-1deg)}
  .portfolio img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .tag{position:absolute;left:90px;top:185px;width:470px;font-weight:900;font-size:92px;line-height:.88;text-transform:uppercase;letter-spacing:-3px}
</style>
</head>
<body>
<div class="grid"></div>
<div class="label">Kislap builder</div>
<div class="tag">Forms in. Public pages out.</div>
<div class="builder"><img src="http://localhost:4321/assets/home/builder-workspace.png"></div>
<div class="portfolio"><img src="http://localhost:4321/assets/home/published-output-desktop.png"></div>
<div class="phone link"><img src="http://localhost:4321/assets/home/link-page-screen.png"></div>
<div class="phone menu"><img src="http://localhost:4321/assets/home/digital-menu-screen.png"></div>
</body>
</html>
