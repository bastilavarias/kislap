<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box} body{margin:0;width:1800px;height:900px;overflow:hidden;background:#050505;font-family:Arial,Helvetica,sans-serif;color:#fff;padding:54px}
  .title{position:absolute;left:54px;top:42px;font-weight:900;font-size:54px;line-height:.9;text-transform:uppercase;letter-spacing:-1px}
  .wrap{position:absolute;left:54px;right:54px;bottom:54px;top:150px;display:grid;grid-template-columns:1.25fr .82fr .82fr;gap:34px;align-items:stretch}
  .panel{position:relative;border:7px solid #fff;background:#fff;box-shadow:16px 16px 0 #ff2f35;overflow:hidden;color:#000}
  .panel:nth-child(2){box-shadow:16px 16px 0 #00b86b}.panel:nth-child(3){box-shadow:16px 16px 0 #fff200}
  img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}.portfolio img{object-position:top center}.label{position:absolute;left:18px;bottom:18px;border:5px solid #000;background:#fff;padding:12px 16px;font-weight:900;font-size:24px;text-transform:uppercase;box-shadow:7px 7px 0 #000}
</style>
</head>
<body>
<div class="title">Portfolio, link page, menu.</div>
<div class="wrap">
  <div class="panel portfolio"><img src="http://localhost:4321/assets/home/portfolio-screen.png"><div class="label">Portfolio</div></div>
  <div class="panel"><img src="http://localhost:4321/assets/home/link-page-screen.png"><div class="label">Link page</div></div>
  <div class="panel"><img src="http://localhost:4321/assets/home/digital-menu-screen.png"><div class="label">Menu</div></div>
</div>
</body>
</html>
